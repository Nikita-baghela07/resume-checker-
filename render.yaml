services:
  - type: web
    name: optiresume-ai-backend
    runtime: python
    buildCommand: pip install -r resume-checker-/backend/requirements-deploy.txt
    startCommand: cd resume-checker-/backend && gunicorn -w 2 -b 0.0.0.0:8000 --timeout 120 --access-logfile - run:app
    envVars:
      - key: ENABLE_SBERT_MODEL
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://optiresume.vercel.app

databases:
  - name: optiresume-db
    databaseName: optiresume
    user: optiresume
